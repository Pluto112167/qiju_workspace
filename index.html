<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#253b33">
  <meta name="description" content="栖居 · 一个安静的个人工作台">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="栖居">
  <title>栖居 · 个人工作台</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">栖</div>
        <div class="brand-copy">
          <strong>栖居</strong>
          <span>个人工作台</span>
        </div>
        <button class="sidebar-close" type="button" data-action="toggle-sidebar" aria-label="关闭菜单">×</button>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot">
        <div class="save-status" id="saveStatus">
          <span class="save-dot"></span>
          <span id="saveStatusText">本地自动保存</span>
        </div>
        <p class="sidebar-quote">把日子过成<br>可以回看的样子。</p>
      </div>
    </aside>

    <div class="sidebar-backdrop" data-action="toggle-sidebar"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" type="button" data-action="toggle-sidebar" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="page-heading">
          <h1 id="pageTitle">首页</h1>
          <p id="pageSubtitle">今天也留一点空白。</p>
        </div>
        <div class="topbar-right">
          <div class="today-chip" id="todayChip"></div>
          <button class="btn btn-primary top-add" type="button" data-action="new-task">
            <span class="plus" aria-hidden="true">＋</span>
            <span>新任务</span>
          </button>
        </div>
      </header>

      <div id="app" class="view" aria-live="polite"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="reminderRoot" class="reminder-root" aria-live="assertive"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js" defer></script>
</body>
</html>
